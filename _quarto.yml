              - auto: "content/courses/MathArtDesign/Modules/20-Systems/*/index.qmd"

          - section: "Symmetry"
            href: content/courses/MathArtDesign/Modules/30-Symmetry/listing.qmd
            contents:
              - auto: "content/courses/MathArtDesign/Modules/30-Symmetry/*/index.qmd"

          - section: "Iteration"
            href: content/courses/MathArtDesign/Modules/40-Iteration/listing.qmd
