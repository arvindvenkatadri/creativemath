project:
  type: website
  output-dir: _site
  resources:
    - fonts/*

  preview:
    port: 4040
    browser: true

knitr:
  opts_chunk:
    echo: true
    warning: false
    message: false
    fig-align: center
    fig-width: 7
    fig-asp: 0.618
    dpi: 96
    out-width: "75%"
    dev: ragg_png
    tidy: styler

page-layout: full

brand: _brand.yml

execute:
  freeze: auto
  cache: false
  error: true

website:
  title: "Applied Math for Makers and Artists"
  description: >-
    Arvind V.'s website for teaching mathematics and systems to artists and
    designers who want to use mathematics as a tool for making artifacts and
    experiences.
  site-url: https://mathformakers.netlify.app/
  repo-url: https://github.com/arvindvenkatadri/creativemath
  favicon: content/materials/icon-park-twotone--concept-sharing.svg
  open-graph: true
  twitter-card: true
  search: true
  reader-mode: true

  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true

  navbar:
    pinned: false
    collapse: true
    collapse-below: lg
    right:
      - icon: github
        href: https://github.com/arvindvenkatadri/creativemath
      - icon: twitter
        href: https://twitter.com/arvind_v
      - icon: linkedin
        href: https://www.linkedin.com/in/arvindvenkatadri
      - icon: envelope
        href: mailto:arvind.venkatadri@gmail.com

  sidebar:
    style: docked
    alignment: left
    collapse-level: 2
    search: true
    logo: content/materials/images/Catterpillar.jpg

    contents:
      - section: "Applied Math for Makers and Artists"
        href: content/courses/MathArtDesign/listing.qmd
        contents:

          - section: "Tools and Tech"
            href: content/courses/MathArtDesign/Modules/500-Tech/listing.qmd
            contents:
              - auto: "content/courses/MathArtDesign/Modules/500-Tech/*/index.qmd"

          - section: "Math Basics"
            href: content/courses/MathArtDesign/Modules/05-Maths/listing.qmd
            contents:
              - auto: "content/courses/MathArtDesign/Modules/05-Maths/*/index.qmd"

          - section: "Systems"
            href: content/courses/MathArtDesign/Modules/20-Systems/listing.qmd
