format:
  html:
    theme:
      - lux
      # - css/custom.scss

    smooth-scroll: true
    fontsize: large

    link-external-icon: true
    link-external-newwindow: true
    citations-hover: true
    footnotes-hover: true

    code-tools: false
    code-copy: true
    code-block-border-left: black
    code-block-bg: "#E7FBFE"
    code-fold: false
    code-summary: "Show the Code"
    code-overflow: scroll
    code-line-numbers: false
    code-link: true
    code-annotations: true
    format-links: true
    highlight-style: tango

    reference-location: document
    cap-location: bottom
    df-print: kable

    toc: true
    fig-align: center
    fig-cap-location: bottom
    out-width: "75%"

    filters:
      - d2
      - tabby
      - webr
      - quarto
      - line-highlight
      - shinylive
      - gadenbuie/tachyons

    d2:
      format: svg
      embed_mode: raw

    webr:
      channel-type: automatic

    mermaid:
      theme: forest

    grid:
      sidebar-width: 250px
      body-width: 1000px
      margin-width: 250px
      gutter-width: 1.5rem

editor:
  source:
    markdown:
      wrap: 72

lightbox:
  match: auto
  effect: zoom
  desc-position: right
  loop: false
  
