project:
  type: website
  output-dir: _site
  resources:
    - fonts/*

  preview:
    port: 4040
    browser: true

knitr:
  opts_chunk:
    echo: true
    warning: false
    message: false
    fig-align: center
    fig-width: 7
    fig-asp: 0.618
    dpi: 96
    out-width: "75%"
    dev: ragg_png
    tidy: styler

page-layout: full

brand: _brand.yml

execute:
  freeze: auto
  cache: false
  error: true

website:
  title: "Applied Math for Makers and Artists"
  description: >-
    Arvind V.'s website for teaching mathematics and systems to artists and
    designers who want to use mathematics as a tool for making artifacts and
    experiences.
  site-url: https://mathformakers.netlify.app/
  repo-url: https://github.com/arvindvenkatadri/creativemath
  favicon: content/materials/icon-park-twotone--concept-sharing.svg
  open-graph: true
  twitter-card: true
  search: true
  reader-mode: true

  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true

  navbar:
    pinned: false
    collapse: true
    collapse-below: lg
    right:
      - href: about.qmd
        icon: person
      - icon: github
        href: https://github.com/arvindvenkatadri/creativemath
      - icon: twitter
        href: https://twitter.com/arvind_v
      - icon: linkedin
        href: https://www.linkedin.com/in/arvindvenkatadri
      - icon: envelope
        href: mailto:arvind.venkatadri@gmail.com

  sidebar:
    style: docked
    alignment: left
    collapse-level: 2
    search: true
    logo: content/materials/images/Catterpillar.jpg

    contents:
      - section: "Course Modules"
        href: content/courses/MathArtDesign/listing.qmd
        contents:

          - section: "Tools and Tech"
            href: content/courses/MathArtDesign/Modules/500-Tech/listing.qmd
            contents:
              - auto: "content/courses/MathArtDesign/Modules/500-Tech/*/index.qmd"

          - section: "Math Basics"
            href: content/courses/MathArtDesign/Modules/05-Maths/listing.qmd
            contents:
              - auto: "content/courses/MathArtDesign/Modules/05-Maths/*/index.qmd"

          - section: "Symmetry"
            href: content/courses/MathArtDesign/Modules/30-Symmetry/listing.qmd
            contents:
              - auto: "content/courses/MathArtDesign/Modules/30-Symmetry/*/index.qmd"

          - section: "Iteration"
            href: content/courses/MathArtDesign/Modules/40-Iteration/listing.qmd
            contents:
              - auto: "content/courses/MathArtDesign/Modules/40-Iteration/*/index.qmd"

          - section: "Connection"
            href: content/courses/MathArtDesign/Modules/60-Connection/listing.qmd
            contents:
              - auto: "content/courses/MathArtDesign/Modules/60-Connection/*/index.qmd"

          - section: "Systems"
            href: content/courses/MathArtDesign/Modules/20-Systems/listing.qmd
            contents:
              - auto: "content/courses/MathArtDesign/Modules/20-Systems/*/index.qmd"


          - section: "Sound and Media"
            href: content/courses/MathArtDesign/Modules/70-Media/listing.qmd
            contents:
              - auto: "content/courses/MathArtDesign/Modules/70-Media/*/index.qmd"

          - section: "AI"
            href: content/courses/MathArtDesign/Modules/100-AI/listing.qmd
            contents:
              - auto: "content/courses/MathArtDesign/Modules/100-AI/*/index.qmd"

          - section: "Projects"
            href: content/courses/MathArtDesign/Modules/1000-Projects/index.qmd
            contents:
              - content/courses/MathArtDesign/Modules/1000-Projects/index.qmd
            
  page-footer:
    center: "Website made with ❤️ and [Quarto](https://quarto.org/), by Arvind V."
    right: "Hosted by Netlify [{{< iconify simple-icons netlify >}}](https://www.netlify.com)."
    left: "License: [CC BY-SA 2.0](https://creativecommons.org/licenses/by-sa/2.0/)"
    background: light

format:
  html:
    theme:
      - lux
      # - css/custom.scss

    smooth-scroll: true
    fontsize: large

    link-external-icon: true
    link-external-newwindow: true
    citations-hover: true
    footnotes-hover: true

    code-tools: false
    code-copy: true
    code-block-border-left: black
    code-block-bg: "#E7FBFE"
    code-fold: true
    code-summary: "Show the Code"
    code-overflow: scroll
    code-line-numbers: false
    code-link: true
    code-annotations: true
    format-links: true
    highlight-style: tango

    reference-location: document
    cap-location: bottom
    df-print: kable

    toc: true
    fig-align: center
    fig-cap-location: bottom
    out-width: "75%"

    filters:
      - d2
      - tabby
      - webr
      - quarto
      - line-highlight
      - shinylive
      - gadenbuie/tachyons

    d2:
      format: svg
      embed_mode: raw

    webr:
      channel-type: automatic

    mermaid:
      theme: forest

    grid:
      sidebar-width: 250px
      body-width: 1000px
      margin-width: 250px
      gutter-width: 1.5rem

editor:
  source:
    markdown:
      wrap: 72

lightbox:
  match: auto
  effect: zoom
  desc-position: right
  loop: false
  
